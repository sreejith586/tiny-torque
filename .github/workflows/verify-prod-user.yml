name: Verify prod user (read-only)

# TEMPORARY throwaway: read-only checks on PROD — varunsudhakar@gmail.com's account/profile, and
# whether ai-scan is actually usable (flag + function deployment + secret presence). Self-scoped
# push trigger so it runs once; removed right after. Never writes, never prints secret values.
on:
  push:
    branches: [sprint-1]
    paths: ['.github/workflows/verify-prod-user.yml']

jobs:
  verify:
    name: read prod
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: 2.119.0 }

      - name: psql read (user + flags)
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_PROD_DB_PASSWORD }}
          PGHOST: aws-0-ap-south-1.pooler.supabase.com
          PGPORT: '5432'
          PGUSER: postgres.whjqwcaoexbytspkaxfh
          PGDATABASE: postgres
          PGSSLMODE: require
        run: |
          echo "== auth.users row =="
          psql -c "select id, email, email_confirmed_at is not null as confirmed, created_at from auth.users where email = 'varunsudhakar@gmail.com';"
          echo "== profiles row (joined by id) =="
          psql -c "select p.handle, p.display_name, p.account_type, p.country_code, p.onboarding_completed_at is not null as onboarded, p.created_at from auth.users u join public.profiles p on p.id = u.id where u.email = 'varunsudhakar@gmail.com';"
          echo "== ai_scan + related flags =="
          psql -c "select key, enabled, description from public.feature_flags where key in ('ai_scan','ai_scan_group','marketplace_publish') order by key;"

      - name: ai-scan Edge Function deployment status
        run: |
          supabase link --project-ref whjqwcaoexbytspkaxfh
          echo "== deployed functions on prod =="
          supabase functions list --project-ref whjqwcaoexbytspkaxfh
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_PROD_DB_PASSWORD }}

      - name: ai-scan Edge Function secrets (names only, never values)
        run: supabase secrets list --project-ref whjqwcaoexbytspkaxfh
