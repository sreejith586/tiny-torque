name: Update visual baselines
# Manual tool (D-041): regenerates e2e/__screenshots__ against a LOCAL server built from the pushed
# code, and uploads them as the "updated-baselines" artifact to download and commit. Deterministic —
# it screenshots the exact checked-out commit, so it never races a Vercel deploy (the old preview
# path lagged behind pushes and produced stale baselines). D-041 requires Linux-generated baselines;
# this CI runner provides that. Trigger: `gh workflow run update-baselines.yml` (no inputs), then
# download the artifact and copy it over e2e/__screenshots__ in the PR.
on:
  workflow_dispatch:

jobs:
  update:
    name: regenerate baselines (local server)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e:update
        env:
          LOCAL_VISUAL: '1'
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      - uses: actions/upload-artifact@v4
        with: { name: updated-baselines, path: e2e/__screenshots__, retention-days: 7 }
