name: CI
on:
  pull_request:
  push:
    branches: [main, staging, 'sprint-*']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: typecheck · lint · unit · guard · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Decision guard (D-023)
        run: bash docs/plan/tools/guard.sh
      - name: Build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder

  migrations:
    name: migrations apply cleanly (D-006)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q postgresql-client
      - run: bash scripts/db-validate.sh
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      - name: Generated types are up to date
        run: |
          corepack enable && pnpm install --frozen-lockfile
          DATABASE_URL="postgres://postgres:postgres@127.0.0.1:5432/mv_validate" pnpm gen:types:db
          git diff --exit-code src/types/supabase.ts || (echo "::error::src/types/supabase.ts is stale — run pnpm gen:types"; exit 1)

  e2e:
    name: playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: checks
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          # Points at the Vercel preview once MV-S0-06 is done; until then the
          # local build is used (playwright.config.ts starts `next start`).
          BASE_URL: ${{ vars.E2E_BASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL || 'https://ci-placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY || 'ci-placeholder' }}
          E2E_TEST_PHONE: ${{ secrets.E2E_TEST_PHONE }}
          E2E_TEST_OTP: ${{ secrets.E2E_TEST_OTP }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report, retention-days: 7 }
