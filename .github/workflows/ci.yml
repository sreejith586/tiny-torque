name: CI
on:
  pull_request:
  push:
    branches: [main, staging, 'sprint-*']
  deployment_status: # Vercel preview ready → run Playwright against it (Supabase branch DB behind it, D-033)

concurrency:
  # Scoped per event, not just per ref: a `push` (checks/migrations) and a `deployment_status`
  # (Playwright against the Vercel preview) for the same branch used to share one group, so
  # every push cancelled whatever Playwright run was still going for an earlier commit -- it
  # takes 5-10 min (Vercel deploy + browser install + tests), longer than a typical push cadence
  # while iterating, so it kept getting killed before finishing. Confirmed via run history: every
  # deployment_status run on sprint-1 was "cancelled", none had actually failed on its own merits.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: typecheck · lint · unit · guard · build
    if: github.event_name != 'deployment_status'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Decision guard (D-023)
        run: bash docs/plan/tools/guard.sh
      - name: Build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder

  visual-local:
    name: visual baselines (anon, local server)
    if: github.event_name != 'deployment_status'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Anon fixture screens (/market) against a local `pnpm start` — deterministic, unlike the
      # Vercel preview. LOCAL_VISUAL=1 makes playwright.config start the webServer; VERCEL_ENV is
      # unset so the fixture harness (mv_visual cookie) is honoured.
      - run: pnpm exec playwright test --project=visual-local
        env:
          LOCAL_VISUAL: '1'
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: visual-local-report, path: playwright-report, retention-days: 7 }

  migrations:
    name: migrations apply cleanly (D-006)
    if: github.event_name != 'deployment_status'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update -q && sudo apt-get install -y -q postgresql-client
      - run: bash scripts/db-validate.sh
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      - name: Generated types are up to date
        run: |
          DATABASE_URL="postgres://postgres:postgres@127.0.0.1:5432/mv_validate" pnpm gen:types:db
          git diff --exit-code src/types/supabase.ts || (echo "::error::src/types/supabase.ts is stale — run pnpm gen:types"; exit 1)

  pgtap:
    name: pgTAP RLS matrix (D-013)
    if: github.event_name != 'deployment_status'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        # supabase/postgres, not plain postgres: ships pgtap + the real auth schema/functions
        # (auth.uid(), auth.role()) so the RLS matrix runs against the same auth.uid()
        # implementation production uses, not scripts/pg-stub.sql's stand-in.
        image: supabase/postgres:15.14.1.178
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q postgresql-client
      - name: Storage schema stub
        # supabase/postgres ships the `storage` schema and the real `auth` schema/functions,
        # but not storage's own tables (those come from the storage-api service's own
        # migrations in the full local stack, not the postgres image) -- the baseline
        # migration's storage.buckets/storage.objects policies need them to exist. Connect as
        # supabase_admin (the actual superuser in this image -- `postgres` here is a scoped,
        # non-superuser role, confirmed via pg_roles/pg_namespace; storage is owned by
        # supabase_admin) so this and every later step has uniform full privileges, same as
        # the plain-postgres "migrations apply cleanly" job.
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -c "
            create schema if not exists storage;
            create table if not exists storage.buckets (id text primary key, name text, public boolean default false);
            create table if not exists storage.objects (id uuid primary key default gen_random_uuid(), bucket_id text, name text, owner uuid);
            alter table storage.objects enable row level security;
            create or replace function storage.foldername(name text) returns text[] language sql immutable as \$\$ select (string_to_array(name, '/'))[1:array_length(string_to_array(name,'/'),1)-1] \$\$;
          "
        env:
          DATABASE_URL: postgres://supabase_admin:postgres@127.0.0.1:5432/postgres
      - name: Apply migrations
        run: |
          for f in supabase/migrations/*.sql; do
            echo "→ $f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"
          done
        env:
          DATABASE_URL: postgres://supabase_admin:postgres@127.0.0.1:5432/postgres
      - name: Run pgTAP tests
        # ON_ERROR_STOP only catches actual SQL errors -- a failed pgTAP assertion ("not ok")
        # is a normal query result row, not an error, so psql exits 0 regardless. Grep the
        # output for "not ok" explicitly and fail the step if any test failed.
        run: |
          set -uo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -c "create extension if not exists pgtap;"
          fail=0
          for f in supabase/tests/*.sql; do
            echo "→ $f"
            if ! psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f" | tee /tmp/pgtap-out.txt; then
              echo "::error::$f errored"
              fail=1
            fi
            if grep -qE '^\s*not ok ' /tmp/pgtap-out.txt; then
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::pgTAP reported one or more failing tests"
            exit 1
          fi
        env:
          DATABASE_URL: postgres://supabase_admin:postgres@127.0.0.1:5432/postgres

  e2e:
    name: playwright smoke on Vercel preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Vercel names the environment "Preview" / "Preview – <project>"; production deployments are skipped here.
    if: >-
      github.event_name == 'deployment_status' &&
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment_url != '' &&
      !contains(github.event.deployment.environment, 'Production')
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event.deployment.sha }}" }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          BASE_URL: ${{ github.event.deployment_status.environment_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          # Phone sign-in smoke is opt-in until an SMS provider / test OTP is verified on branches (D-037).
          # Set repo variable E2E_ENABLE_PHONE_SIGNIN=1 to turn it on; matches [auth.sms.test_otp] in config.toml.
          E2E_ENABLE_PHONE_SIGNIN: ${{ vars.E2E_ENABLE_PHONE_SIGNIN }}
          E2E_TEST_PHONE: '+919999900001'
          E2E_TEST_OTP: '246810'
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report, retention-days: 7 }
