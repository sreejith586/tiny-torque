name: CI
on:
  pull_request:
  push:
    branches: [main, staging, 'sprint-*']
  deployment_status: # Vercel preview ready → run Playwright against it (Supabase branch DB behind it, D-033)

concurrency:
  # Scoped per event AND per branch. Two things went wrong with the old `ci-<event>-<ref>` key:
  #  (1) a `push` (checks/migrations) and a `deployment_status` (Playwright against the Vercel
  #      preview) for the same branch shared one group, so every push cancelled the 5-10 min
  #      Playwright run still going for an earlier commit (every deployment_status run on sprint-1
  #      was "cancelled", none had failed on its merits) — hence the event name in the key;
  #  (2) for `deployment_status` events `github.ref` is the repository's DEFAULT branch, not the
  #      deployed one, so previews of DIFFERENT PRs still collided: on 2026-10-20 PRs #95 and #96
  #      cancelled each other's Playwright runs over and over. Deployment-triggered runs are now
  #      keyed by the deployment's own ref (its branch; sha as the fallback), so only a newer
  #      preview of the SAME branch supersedes a running one — which is the one case where
  #      cancel-in-progress is wanted.
  #  (3) Vercel sends one deployment_status event per state change (pending → success); a
  #      `pending` run skips every job, yet as a new member of the group it would still cancel
  #      the previous deploy's Playwright run. So only a run that will actually do work — a
  #      `success` status, or any push / pull_request — may cancel an in-progress one. (The
  #      "cancelled" e2e runs seen on #111 turned out to be the job's own timeout, fixed in the
  #      theme-matrix step; this guard stays as the cheap belt-and-braces.)
  group: ci-${{ github.event_name }}-${{ github.event_name == 'deployment_status' && (github.event.deployment.ref || github.event.deployment.sha) || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'deployment_status' || github.event.deployment_status.state == 'success' }}

jobs:
  checks:
    name: typecheck · lint · unit · guard · build
    if: github.event_name != 'deployment_status'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Decision guard (D-023)
        run: bash docs/plan/tools/guard.sh
      - name: Dependency audit (production deps, high and above — MV-S10-01)
        # Exceptions live in package.json › pnpm.auditConfig.ignoreGhsas, each one justified in
        # docs/security-review.md §5. A new high / critical advisory fails this step.
        run: pnpm audit:prod
      - name: Theme contrast (WCAG AA over the 6 themes, F-17 / MV-S9-04)
        run: node scripts/contrast-check.mjs
      - name: Build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder

  lighthouse:
    name: lighthouse budget (F-17, MV-S9-03)
    if: github.event_name != 'deployment_status'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      - name: Client bundle report (first-load JS per route)
        # Budget = the ceiling measured in MV-S9-03 after the pass (heaviest route 368 KB gz; the
        # remaining big items are zod v4 at ~88 KB on every service-using route and the React +
        # Next + Sentry runtime at ~123 KB). Ratchet it down with each follow-up (zod/mini, …).
        run: node scripts/bundle-report.mjs --budget 400 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Lighthouse CI (mobile, 4G, 4x CPU — 05 S9 "mid-range Android over 4G")
        # Public pages plus the signed-in screens rendered from the ?__visual=1 fixtures (no DB in
        # CI, src/lib/visual-fixtures.ts). Budgets live in lighthouserc.json: a11y ≥ 0.9 and
        # perf ≥ 0.75 fail the job (D-104; median of 3; /market measures 0.79–0.81, /garage 0.84 on
        # the two fixture-data pages under the 4× CPU throttle — 0.9 is the staging target, measured
        # on the preview, and the next ratchet); script ≤ 450 KB, total ≤ 1.2 MB per page.
        run: |
          pnpm start -p 3000 &
          npx --yes wait-on@8 http://127.0.0.1:3000/login -t 60000
          npx --yes @lhci/cli@0.14.0 autorun \
            --collect.url=http://127.0.0.1:3000/ \
            --collect.url=http://127.0.0.1:3000/login \
            --collect.url=http://127.0.0.1:3000/market?__visual=1 \
            --collect.url=http://127.0.0.1:3000/garage?__visual=1 \
            --collect.url=http://127.0.0.1:3000/garage/add
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: lighthouse-report, path: .lighthouseci, retention-days: 7 }

  migrations:
    name: migrations apply cleanly (D-006)
    if: github.event_name != 'deployment_status'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update -q && sudo apt-get install -y -q postgresql-client
      - run: bash scripts/db-validate.sh
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      - name: Generated types are up to date
        run: |
          DATABASE_URL="postgres://postgres:postgres@127.0.0.1:5432/mv_validate" pnpm gen:types:db
          git diff --exit-code src/types/supabase.ts || (echo "::error::src/types/supabase.ts is stale — run pnpm gen:types"; exit 1)

  pgtap:
    name: pgTAP RLS matrix (D-013)
    if: github.event_name != 'deployment_status'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        # supabase/postgres, not plain postgres: ships pgtap + the real auth schema/functions
        # (auth.uid(), auth.role()) so the RLS matrix runs against the same auth.uid()
        # implementation production uses, not scripts/pg-stub.sql's stand-in.
        image: supabase/postgres:15.14.1.178
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q postgresql-client
      - name: Storage schema stub
        # supabase/postgres ships the `storage` schema and the real `auth` schema/functions,
        # but not storage's own tables (those come from the storage-api service's own
        # migrations in the full local stack, not the postgres image) -- the baseline
        # migration's storage.buckets/storage.objects policies need them to exist. Connect as
        # supabase_admin (the actual superuser in this image -- `postgres` here is a scoped,
        # non-superuser role, confirmed via pg_roles/pg_namespace; storage is owned by
        # supabase_admin) so this and every later step has uniform full privileges, same as
        # the plain-postgres "migrations apply cleanly" job.
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -c "
            create schema if not exists storage;
            create table if not exists storage.buckets (id text primary key, name text, public boolean default false);
            create table if not exists storage.objects (id uuid primary key default gen_random_uuid(), bucket_id text, name text, owner uuid);
            alter table storage.objects enable row level security;
            create or replace function storage.foldername(name text) returns text[] language sql immutable as \$\$ select (string_to_array(name, '/'))[1:array_length(string_to_array(name,'/'),1)-1] \$\$;
          "
        env:
          DATABASE_URL: postgres://supabase_admin:postgres@127.0.0.1:5432/postgres
      - name: Apply migrations
        run: |
          for f in supabase/migrations/*.sql; do
            echo "→ $f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"
          done
        env:
          DATABASE_URL: postgres://supabase_admin:postgres@127.0.0.1:5432/postgres
      - name: Run pgTAP tests
        # ON_ERROR_STOP only catches actual SQL errors -- a failed pgTAP assertion ("not ok")
        # is a normal query result row, not an error, so psql exits 0 regardless. Grep the
        # output for "not ok" explicitly and fail the step if any test failed.
        run: |
          set -uo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -c "create extension if not exists pgtap;"
          fail=0
          for f in supabase/tests/*.sql; do
            echo "→ $f"
            if ! psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f" | tee /tmp/pgtap-out.txt; then
              echo "::error::$f errored"
              fail=1
            fi
            if grep -qE '^\s*not ok ' /tmp/pgtap-out.txt; then
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::pgTAP reported one or more failing tests"
            exit 1
          fi
        env:
          DATABASE_URL: postgres://supabase_admin:postgres@127.0.0.1:5432/postgres

  e2e:
    name: playwright smoke on Vercel preview
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Vercel names the environment "Preview" / "Preview – <project>"; production deployments are skipped here.
    if: >-
      github.event_name == 'deployment_status' &&
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment_url != '' &&
      !contains(github.event.deployment.environment, 'Production')
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event.deployment.sha }}" }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          BASE_URL: ${{ github.event.deployment_status.environment_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          # Phone sign-in smoke is opt-in until an SMS provider / test OTP is verified on branches (D-037).
          # Set repo variable E2E_ENABLE_PHONE_SIGNIN=1 to turn it on; matches [auth.sms.test_otp] in config.toml.
          E2E_ENABLE_PHONE_SIGNIN: ${{ vars.E2E_ENABLE_PHONE_SIGNIN }}
          E2E_TEST_PHONE: '+919999900001'
          E2E_TEST_OTP: '246810'
          # MV-S4-08 (F-06): opt-in until marketplace_publish=true is confirmed on the target
          # Supabase project. Set repo variable E2E_ENABLE_MARKETPLACE_PUBLISH=1 to turn it on.
          E2E_ENABLE_MARKETPLACE_PUBLISH: ${{ vars.E2E_ENABLE_MARKETPLACE_PUBLISH }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report, retention-days: 7 }
      - name: Theme QA screenshot matrix (MV-S9-05, D-056 review aid — never a gate)
        if: always()
        continue-on-error: true
        # Its own time box: the first version waited out the 3.5 s brand splash on each of the 336
        # shots and ran past the job's 20 min — the whole e2e job came back "cancelled" (#111).
        timeout-minutes: 12
        run: THEME_MATRIX=1 pnpm exec playwright test e2e/theme-matrix.spec.ts --project=desktop --workers=3 --reporter=line
        env:
          BASE_URL: ${{ github.event.deployment_status.environment_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: theme-matrix, path: playwright-report/theme-matrix, retention-days: 14, if-no-files-found: ignore }
